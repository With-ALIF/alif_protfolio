<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050816">
  <title>404 — Page Not Found | Alif</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050816; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .error-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 3rem 2.5rem; max-width: 420px; width: 100%; text-align: center; }
    .error-code { font-size: 5rem; font-weight: 800; background: linear-gradient(135deg, #FFB703, #FF6B35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .error-title { font-size: 1.3rem; margin: 1rem 0 0.5rem; font-weight: 600; }
    .error-desc { font-size: 0.9rem; color: #8892b0; line-height: 1.6; margin-bottom: 2rem; }
    .error-btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #FFB703, #FF6B35); color: #050816; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; transition: opacity 0.2s; }
    .error-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="error-btn">Back to Home</a>
  </div>
</body>
</html>
