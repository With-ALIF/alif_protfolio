<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Portfolio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/panel.css">
</head>
<body>
  <div class="admin-panel-layout">
    <aside class="admin-panel-sidebar">
      <div class="admin-panel-brand">ALIF<span>Admin</span></div>
      <nav class="admin-panel-nav" id="admin-panel-nav"></nav>
      <div class="admin-panel-footer-actions">
        <a href="/index.html" class="admin-panel-btn-outline" target="_blank">View Site</a>
        <button id="admin-logout-btn" class="admin-panel-btn-danger">Logout</button>
      </div>
    </aside>
    <main class="admin-panel-main">
      <header class="admin-panel-topbar">
        <button id="admin-sidebar-toggle" class="admin-sidebar-toggle">&#9776;</button>
        <h2 id="admin-section-title">Dashboard</h2>
        <div class="admin-panel-topbar-right">
          <span id="admin-email"></span>
        </div>
      </header>
      <div class="admin-panel-content" id="admin-panel-content">
        <div class="admin-panel-loading">Loading content...</div>
      </div>
    </main>
  </div>
  <div id="admin-toast" class="admin-toast"></div>
  <div id="admin-confirm-modal" class="admin-modal-overlay">
    <div class="admin-modal-card">
      <div class="admin-modal-icon">⚠️</div>
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-message">This action cannot be undone.</p>
      <div class="admin-modal-actions">
        <button class="admin-modal-cancel" id="confirm-cancel">Cancel</button>
        <button class="admin-modal-delete" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>
  <div id="session-timeout-modal" class="admin-modal-overlay">
    <div class="admin-modal-card">
      <div class="admin-modal-icon">⏰</div>
      <h3>Session Expired</h3>
      <p>Your session has expired due to inactivity.</p>
      <div class="admin-modal-actions">
        <button class="admin-modal-delete" id="timeout-logout-btn">Logout</button>
      </div>
    </div>
  </div>
  <script type="module" src="/admin/panel.js"></script>
</body>
</html>
